  <!-- Game art. -->
  <template id="page-game-art" data-title="Game Art">
    <main class="work-page page-frame" id="page-content">
      <section class="work-hero" aria-label="GAME ART">
        <img
          src="assets/gameHero-1920w.webp"
          data-widths="640 1280 1920"
          alt="GAME ART cover artwork"
          class="work-hero-image"
          loading="eager"
          fetchpriority="high"
        >

        <div class="work-hero-titles">
          <p>The power of making</p>
          <h1>GAME ART</h1>
        </div>

        <template data-include="site-header"></template>
      </section>

      <div class="game-content">
        <h2 class="project-title">YOUR FORM...<wbr>INCOMPLORBED</h2>

        <div class="game-layout">
          <div class="game-aside">
            <a
              class="red-action"
              href="https://twafla.itch.io/oh-my-glurp"
              target="_blank"
              rel="noopener noreferrer"
              title="Play Oh My Glurp on itch.io"
            >
              PLAAAY <span aria-hidden="true">↗</span>
            </a>

            <div class="game-small-images">
              <button type="button" class="artwork-zoom" data-art>
                <img
                  src="assets/gameSmallOne-2560w.webp"
                  data-widths="640 1280 2560"
                  sizes="(max-width: 760px) 50vw, 25vw"
                  alt="Your Form Incomplorbed — in-game desk screenshot"
                >
              </button>

              <button type="button" class="artwork-zoom" data-art>
                <img
                  src="assets/gameSmallTwo-2560w.webp"
                  data-widths="640 1280 2560"
                  sizes="(max-width: 760px) 50vw, 25vw"
                  alt="Your Form Incomplorbed — game environment screenshot"
                >
              </button>
            </div>

            <div class="game-description">
              <h3>Matfyz Game Jam<br>Spring 2026</h3>
              <p class="highlight-paragraph">The game was created during a three-day Game Jam using the Godot engine. <mark data-highlight="game">I was responsible for the game’s overall visual style, “2.5D” environment and sound design.</mark></p>
              <p>The art style reflects the game’s humorous and absurd narrative. It combines an alien setting with the familiar atmosphere of an old city administration office.</p>
              <p>The visual storytelling highlights closed system discrimination against humans through an outdated manual, the robot Bob, and mistakes in human language.</p>
            </div>
          </div>

          <div class="game-screens">
            <button type="button" class="artwork-zoom" data-art>
              <img
                src="assets/gameMainOne-2560w.webp"
                data-widths="640 1280 2560"
                alt="Your Form Incomplorbed — alien administration game environment"
              >
            </button>

            <button type="button" class="artwork-zoom" data-art>
              <img
                src="assets/gameMainTwo-2560w.webp"
                data-widths="640 1280 2560"
                alt="Your Form Incomplorbed — illustrated desk and application form"
              >
            </button>
          </div>

          <img src="assets/gameHand-257w.webp" alt="" class="game-hand">
        </div>
      </div>

          <div class="concept-description">
            <h2>The Victorian bride’s room</h2>
            <p>The room contains key narrative elements (indexical storytelling) that allow the player or viewer to piece together the story.</p>
            <p>Additional personal belongings reflect the main character’s habits, identity, and behavioral residue, such as romantic novels scattered across the floor, jewelry, and paintings of nature.</p>
            <p>To ensure an authentic Victorian-era setting, historical references were thoroughly researched and collected.</p>

            <a class="red-action walkthrough-btn" href="https://youtu.be/tzF9FmW5yhQ" target="_blank" rel="noopener noreferrer">
              WALKTHROUGH <span aria-hidden="true">↗</span>
